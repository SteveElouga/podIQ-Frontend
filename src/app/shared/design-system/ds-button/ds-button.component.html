<button
  [class]="classes"
  [disabled]="isDisabled"
  [attr.type]="type"
  [attr.aria-disabled]="isDisabled"
  [attr.aria-busy]="loading"
>
  @if (loading) {
    <span class="ds-btn__spinner" aria-hidden="true"></span>
  } @else if (icon) {
    <ds-icon [name]="icon" [size]="iconSize" />
  }

  @if (label) {
    {{ label }}
  } @else {
    <ng-content />
  }

  @if (iconRight && !loading) {
    <ds-icon [name]="iconRight" [size]="iconSize" />
  }
</button>
