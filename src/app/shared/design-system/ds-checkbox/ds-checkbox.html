<label class="ds-checkbox" [class.ds-checkbox--align-top]="alignTop()" (click)="onToggle($event)">
  <span class="ds-checkbox__box" [class.ds-checkbox__box--checked]="checked()">
    @if (checked()) {
    <ds-icon name="check" [size]="10" [stroke]="stroke()" />
    }
  </span>
  <span class="ds-checkbox__label">
    <ng-content />
  </span>
</label>
